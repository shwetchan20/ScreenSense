[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screensense"
version = "0.1.0"
description = "Proactive desktop AI copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mss>=10.1.0",
  "numpy>=2.2.0",
  "Pillow>=11.1.0",
  "pydantic>=2.10.0",
  "duckduckgo-search>=6.2.0",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.6",
  "pyttsx3>=2.98",
  "keyboard>=0.13.5",
  "pyperclip>=1.9.0",
  "psutil>=6.1.1",
  "requests>=2.32.3",
  "google-genai>=1.7.0",
  "sentence-transformers>=3.0.0",
  "uiautomation>=2.0.18",
  "watchdog>=5.0.0"
]

[project.optional-dependencies]
voice = [
  "SpeechRecognition>=3.14.1",
  "webrtcvad>=2.0.10",
  "pyaudio>=0.2.14",
  "edge-tts>=7.0.0",
  "playsound==1.2.2"
]
voice_pro = [
  "TTS>=0.22.0"
]
ocr = [
  "pytesseract>=0.3.13"
]
cloud = [
  "google-cloud-firestore>=2.20.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0"
]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.6"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
