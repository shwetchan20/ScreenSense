[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria"
version = "0.1.0"
description = "Local Windows desktop AI copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.0.0",
  "httpx>=0.28.0",
  "mss>=10.1.0",
  "Pillow>=11.1.0",
  "psutil>=6.1.1",
  "pyautogui>=0.9.54",
  "pynput>=1.7.7",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.6",
  "pywin32>=308",
  "uiautomation>=2.0.18",
]

[project.scripts]
aria-local = "aria.main:run_cli"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
